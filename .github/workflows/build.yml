name: Build & Release APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: yaseen-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Yaseen Tutor v1.0.0 (Official Release)
          draft: false
          prerelease: false
          body: |
            ### 📱 Yaseen Tutor - Official Android APK (Release v1.0.0)
            
            - 📖 Surah Yaseen (83 Ayaat) with Urdu Translation & Audio Recitation
            - 🔍 Word-by-word Grammar analysis (Ism, Fe'l, Harf, Zameer)
            - 📊 14-Sigha Verb Conjugation Tables (Gardan for خلق، قال، جعل، وغیرہ)
            - ⚡ Instant 1-Tap Google Sign-In & Offline user profiles
            - 🚀 Ultra-fast zero-deadlock storage engine
            
            **Direct Download:** Click on `app-release.apk` below to download directly to your mobile!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
